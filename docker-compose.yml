services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: game
      POSTGRES_USER: game
      POSTGRES_PASSWORD: game
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U game -d game"]
      interval: 2s
      timeout: 2s
      retries: 30

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://game:game@db:5432/game
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      BASE_PATH: ""
    ports:
      - "8081:8080"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      VITE_BACKEND_URL: http://localhost:8081
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db_data:
